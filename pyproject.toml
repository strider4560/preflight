[project]
name = "preflight"
version = "0.1.0"
description = "Operator guardrails: gate programs that stop a script and name the next step"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "ansible>=11",
  "boto3>=1.40,<2",
  "dnspython>=2.7,<3",
  "pydantic>=2.11,<3",
  "pytest-testinfra>=10,<11",
  "PyYAML>=6,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/preflight"]

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
